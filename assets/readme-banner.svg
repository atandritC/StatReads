<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">StatReads — A Life in Books</title>
  <desc id="desc">A book-inspired reading dashboard banner in StatReads’ deep navy, soft blue, and warm paper colors, with a book and chart illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1530" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1A28"/>
      <stop offset=".58" stop-color="#11283B"/>
      <stop offset="1" stop-color="#1D3A52"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 300 -430 0 1368 100)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#805232" stop-opacity=".38"/>
      <stop offset="1" stop-color="#805232" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFF1E7" fill-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030B12" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="540" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="540" rx="30" fill="url(#warmGlow)"/>
  <rect width="1600" height="540" rx="30" fill="url(#grain)"/>
  <path d="M0 450c260-55 415 42 677 13 224-25 393-104 923-40v117H0V450Z" fill="#050F18" fill-opacity=".24"/>
  <text x="102" y="151" fill="#B5D2E6" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3.6">YOUR READING JOURNEY AT A GLANCE</text>
  <text x="98" y="250" fill="#FFF1E7" font-family="Georgia,Times New Roman,serif" font-size="78" font-weight="700" letter-spacing="-2">StatReads</text>
  <text x="104" y="311" fill="#FFF1E7" font-family="Georgia,Times New Roman,serif" font-size="37">A Life in Books</text>
  <path d="M104 351h64" stroke="#5A9CC0" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="391" fill="#C5D5DF" font-family="Segoe UI,Arial,sans-serif" font-size="20">Turn your StoryGraph or Goodreads export into</text>
  <text x="104" y="423" fill="#C5D5DF" font-family="Segoe UI,Arial,sans-serif" font-size="20">a vivid map of the books you’ve read.</text>
  <text x="104" y="492" fill="#91AFC4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.6">GENRES  ·  DECADES  ·  THEMES  ·  SERIES  ·  READING PACE</text>
  <g filter="url(#shadow)" transform="translate(954 92)">
    <!-- Open book: two warm paper leaves and a quiet central fold -->
    <path d="M53 73c91-40 165-35 242 8v246c-77-42-151-47-242-8V73Z" fill="#FFF1E7"/>
    <path d="M295 81c77-43 151-48 242-8v246c-91-39-165-34-242 8V81Z" fill="#F2E2D4"/>
    <path d="M295 81v238" stroke="#C6A88F" stroke-width="3"/>
    <path d="M87 120c54-18 103-17 151-3M87 146c51-16 100-15 151-2M87 172c51-16 100-15 151-2" stroke="#C2B3A6" stroke-width="5" stroke-linecap="round"/>
    <path d="M352 119c51-16 100-15 151 2M352 145c51-16 100-15 151 2" stroke="#C2B3A6" stroke-width="5" stroke-linecap="round"/>
    <!-- A small publication-year chart rises from the open pages -->
    <path d="M355 262v-29h28v29M394 262v-59h28v59M433 262v-88h28v88M472 262v-126h28v126" fill="#326080"/>
    <path d="M348 267h164" stroke="#805232" stroke-width="3" stroke-linecap="round"/>
    <path d="m352 222 51-37 43 7 56-62" stroke="#5A9CC0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="222" r="6" fill="#5A9CC0"/><circle cx="403" cy="185" r="6" fill="#5A9CC0"/><circle cx="446" cy="192" r="6" fill="#5A9CC0"/><circle cx="502" cy="130" r="6" fill="#5A9CC0"/>
    <text x="68" y="371" fill="#B5D2E6" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">READING, SEEN IN NEW WAYS</text>
  </g>
</svg>
